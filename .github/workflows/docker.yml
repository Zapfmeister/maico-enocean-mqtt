name: docker

# Build and publish a multi-arch image to GitHub Container Registry (ghcr.io).
# Publishing is gated on the test job, so a broken build never ships.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the version tag + GitHub Release
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for the release notes

      - name: Read version from src/__init__.py
        id: ver
        run: echo "version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/__init__.py | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag the release and publish it once per new version. Bump the version in
      # src/__init__.py and a release v<version> is created automatically, with
      # the ready-to-run compose + env example attached as assets.
      - name: Create release for new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            exit 0
          fi
          # Commit-based release notes: GitHub's own generator is PR-centric and
          # we release straight from main, so build "What's Changed" from the
          # commit subjects since the previous tag instead.
          PREV=$(git tag --list 'v*' --sort=-version:refname | head -1)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV"..HEAD
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV...v$VERSION"
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
          } > notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            docker-compose.example.yml .env.example
