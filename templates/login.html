<!DOCTYPE html>
<html lang="{{ t.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.brand }} - {{ t.login }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 320px; }
        .login-box h1 { font-size: 1.3em; margin-bottom: 20px; text-align: center; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #1a73e8; color: white; }
        .btn:hover { background: #1557b0; }
        .error { color: #dc3545; font-size: 13px; margin-bottom: 12px; text-align: center; }
        .lang-switch { text-align: center; margin-top: 16px; }
        .lang-switch a { color: #888; text-decoration: none; padding: 4px 8px; font-size: 12px; }
        .lang-switch a:hover, .lang-switch a.active-lang { color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>{{ t.brand }}</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <input type="password" name="password" placeholder="{{ t.password }}" autofocus required>
            </div>
            <button type="submit" class="btn">{{ t.login }}</button>
        </form>
        <div class="lang-switch">
            <a href="/lang/de" class="{% if t.lang == 'de' %}active-lang{% endif %}">DE</a>
            <a href="/lang/en" class="{% if t.lang == 'en' %}active-lang{% endif %}">EN</a>
        </div>
    </div>
</body>
</html>
