# Production: runs the published, released image. Update with:
#   docker compose pull && docker compose up -d
# To build from local source instead (development), add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  maico-bridge:
    image: ghcr.io/zapfmeister/maico-enocean-mqtt:0.2.1
    container_name: maico-enocean-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - ${ENOCEAN_DEVICE_PATH:-/dev/ttyUSB0}:/dev/enocean
    volumes:
      - ./data:/data
    env_file:
      - .env
