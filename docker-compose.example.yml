# Ready-to-run compose using the pre-built image from ghcr.io — no local build.
#
#   1. cp .env.example .env   # and fill in your MQTT/web settings
#   2. adjust the EnOcean device path below (see README step 2)
#   3. docker compose -f docker-compose.example.yml up -d
#
# The image tag is pinned to this project's released version (kept in sync with
# src/__init__.py by a test) for reproducible deployments. Bump both together.
services:
  maico-bridge:
    image: ghcr.io/zapfmeister/maico-enocean-mqtt:0.2.5
    container_name: maico-enocean-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - ${ENOCEAN_DEVICE_PATH:-/dev/ttyUSB0}:/dev/enocean
    volumes:
      - ./data:/data
    env_file:
      - .env
